[package]
name = "terralux-studio"
version.workspace = true
edition.workspace = true

[[bin]]
name = "terralux-studio"
path = "src/main.rs"

[dependencies]
terralux-core = { path = "../core" }
terralux-render = { path = "../render" }
glam.workspace = true
image.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.37.0"
rfd = "0.18.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
